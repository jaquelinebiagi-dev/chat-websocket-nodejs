<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat em Tempo Real</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #eef1f5; margin: 0; display: flex; justify-content: center; }
    .chat { width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; background: #fff; }
    header { background: #0b4a97; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; margin: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; background: #e9ecf1; word-wrap: break-word; }
    .msg.mine { align-self: flex-end; background: #cfe3ff; }
    .msg .meta { font-size: 11px; color: #555; margin-bottom: 2px; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    #user { width: 120px; }
    #text { flex: 1; }
    button { background: #0b4a97; color: #fff; border: 0; border-radius: 6px; padding: 0 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat">
    <header>
      <h1>Chat em Tempo Real</h1>
      <span id="status">Conectando...</span>
    </header>
    <div id="messages"></div>
    <form id="form">
      <input id="user" placeholder="Seu nome" maxlength="30" required />
      <input id="text" placeholder="Digite uma mensagem..." maxlength="500" autocomplete="off" required />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const statusEl = document.getElementById('status');
    const userEl = document.getElementById('user');
    const textEl = document.getElementById('text');

    userEl.value = localStorage.getItem('chat-user') || '';

    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    const socket = new WebSocket(`${protocol}://${location.host}`);

    socket.onopen = () => (statusEl.textContent = 'Online');
    socket.onclose = () => (statusEl.textContent = 'Desconectado');

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'history') {
        messagesEl.innerHTML = '';
        data.messages.forEach(addMessage);
      } else if (data.type === 'message') {
        addMessage(data.message);
      } else if (data.type === 'users') {
        statusEl.textContent = `Online (${data.count})`;
      }
    };

    function addMessage(msg) {
      const div = document.createElement('div');
      div.className = 'msg' + (msg.user === userEl.value.trim() ? ' mine' : '');

      const meta = document.createElement('div');
      meta.className = 'meta';
      const hora = new Date(msg.timestamp).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      meta.textContent = `${msg.user} • ${hora}`;

      const body = document.createElement('div');
      body.textContent = msg.text; // textContent evita injeção de HTML

      div.append(meta, body);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = userEl.value.trim();
      const text = textEl.value.trim();
      if (!user || !text || socket.readyState !== WebSocket.OPEN) return;
      localStorage.setItem('chat-user', user);
      socket.send(JSON.stringify({ user, text }));
      textEl.value = '';
      textEl.focus();
    });
  </script>
</body>
</html>
